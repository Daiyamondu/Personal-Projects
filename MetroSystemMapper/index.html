<title>Metro System Mapper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: full-height drafting table. Tool rail (left), canvas (centre), layers + properties (right). */
:root{
  --bg:#e8ecea; --panel:#f7f9f8; --panel2:#edf1ef; --ink:#17201e; --muted:#5b6b67; --rule:#d2dad7;
  --accent:#0d7a64; --accent-ink:#ffffff; --accent-soft:#d6eae4; --canvas:#d5dcd9; --sel:#1d6fe8;
  --danger:#c43d2f; --gridc:rgba(60,95,100,.22); --gridc2:rgba(40,90,110,.45); --shadow:0 1px 2px rgba(10,30,25,.08),0 8px 24px rgba(10,30,25,.10);
  --ui:'Public Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --display:'Barlow Semi Condensed','Arial Narrow',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1514; --panel:#172120; --panel2:#1f2b29; --ink:#e4ede9; --muted:#8fa29c; --rule:#2b3a37;
    --accent:#3ccfa9; --accent-ink:#04201a; --accent-soft:#17382f; --canvas:#0b1010; --sel:#5aa2ff;
    --danger:#ff7a6b; --gridc:rgba(150,185,180,.16); --gridc2:rgba(150,185,190,.34); --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1514; --panel:#172120; --panel2:#1f2b29; --ink:#e4ede9; --muted:#8fa29c; --rule:#2b3a37;
  --accent:#3ccfa9; --accent-ink:#04201a; --accent-soft:#17382f; --canvas:#0b1010; --sel:#5aa2ff;
  --danger:#ff7a6b; --gridc:rgba(150,185,180,.16); --gridc2:rgba(150,185,190,.34); --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font:13px/1.4 var(--ui);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.muted{color:var(--muted)}
.grow{flex:1}

#app{display:grid;height:100%;grid-template:"top top top" 52px "tools stage side" minmax(0,1fr) / 56px minmax(0,1fr) 316px}
#top{grid-area:top;display:flex;align-items:center;gap:10px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--rule);min-width:0}
.brand{white-space:nowrap;display:flex;align-items:center;gap:8px;font:700 21px/1 var(--display);letter-spacing:.01em}
.brand svg{width:26px;height:26px}
.nameinp{border:1px solid transparent;background:transparent;border-radius:6px;padding:6px 8px;font-weight:600;min-width:0;width:min(260px,28vw)}
.nameinp:hover{border-color:var(--rule)}
.nameinp:focus{outline:2px solid var(--accent);background:var(--panel2)}
#saveState{font-size:12px;white-space:nowrap}
.btn,.ibtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--rule);background:var(--panel);border-radius:8px;height:34px;padding:0 12px;font-weight:600;white-space:nowrap}
.ibtn{width:34px;padding:0}
.btn:hover,.ibtn:hover{background:var(--panel2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled,.ibtn:disabled{opacity:.4;cursor:default}
.btn.danger{color:var(--danger)}
:focus-visible{outline:2px solid var(--sel);outline-offset:1px}
.narrow-only{display:none}

#tools{grid-area:tools;background:var(--panel);border-right:1px solid var(--rule);display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0;overflow-y:auto}
.tool{position:relative;width:40px;height:40px;border-radius:10px;border:0;background:transparent;display:grid;place-items:center;color:var(--ink)}
.tool:hover{background:var(--panel2)}
.tool.on{background:var(--accent);color:var(--accent-ink)}
.tool kbd{position:absolute;right:3px;bottom:1px;font:600 8.5px/1 var(--ui);opacity:.55}
.tsep{width:24px;height:1px;background:var(--rule);margin:6px 0;flex:none}

#stagewrap{grid-area:stage;position:relative;overflow:hidden;background:var(--canvas);min-width:0}
#stage{position:absolute;inset:0;width:100%;height:100%;touch-action:none;outline:none;user-select:none;-webkit-user-select:none}
#stage[data-tool="hand"],#stage.panning{cursor:grab}
#stage.panning{cursor:grabbing}
#stage[data-tool="line"],#stage[data-tool="area"],#stage[data-tool="rect"],#stage[data-tool="ellipse"],#stage[data-tool="station"],#stage[data-tool="text"],#stage[data-tool="legend"]{cursor:crosshair}
#stage [data-id]{cursor:move}
#stage[data-tool]:not([data-tool="select"]) [data-id]{cursor:inherit}
#gridPath{stroke:var(--gridc)}#gridPath5{stroke:var(--gridc2)}#gridPath,#gridPath5{fill:none}
#frameRect{filter:drop-shadow(0 6px 22px rgba(0,0,0,.22))}
#overlay *{pointer-events:none}
#overlay [data-h]{pointer-events:all}
.ov-box{fill:none;stroke:var(--sel);stroke-width:1.4;stroke-dasharray:5 4;vector-effect:non-scaling-stroke}
.ov-solid{fill:none;stroke:var(--sel);stroke-width:1.6;vector-effect:non-scaling-stroke}
.ov-h{fill:#fff;stroke:var(--sel);stroke-width:1.6;vector-effect:non-scaling-stroke}
.ov-m{fill:var(--sel);fill-opacity:.35;stroke:var(--sel);stroke-width:1;vector-effect:non-scaling-stroke}
.ov-marq{fill:var(--sel);fill-opacity:.1;stroke:var(--sel);stroke-width:1;vector-effect:non-scaling-stroke}
.ov-snap{fill:none;stroke:var(--sel);stroke-width:1.5;vector-effect:non-scaling-stroke}
.ov-ghost{fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:.6}

#optbar{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:6px 10px;box-shadow:var(--shadow);max-width:calc(100% - 24px);overflow-x:auto}
#optbar .sep{width:1px;height:20px;background:var(--rule);flex:none}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--rule);padding:0;flex:none}
.sw.on{box-shadow:0 0 0 2px var(--ink)}
.chk{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;cursor:pointer;font-weight:500}
.chk input{accent-color:var(--accent);width:15px;height:15px;margin:0}
#hint{position:absolute;left:12px;bottom:12px;max-width:min(560px,calc(100% - 200px));background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:7px 11px;font-size:12px;color:var(--muted);box-shadow:var(--shadow)}
#zoomctl{position:absolute;right:12px;bottom:12px;display:flex;align-items:center;background:var(--panel);border:1px solid var(--rule);border-radius:10px;box-shadow:var(--shadow);overflow:hidden}
#zoomctl button{border:0;background:transparent;height:34px;min-width:34px;padding:0 6px;display:grid;place-items:center}
#zoomctl button:hover{background:var(--panel2)}
#zoomLabel{font-variant-numeric:tabular-nums;font-weight:600;min-width:52px}

#side{grid-area:side;background:var(--panel);border-left:1px solid var(--rule);display:flex;flex-direction:column;min-height:0;min-width:0}
.sec{display:flex;flex-direction:column;min-height:0}
#propsec{flex:1 1 52%;border-bottom:1px solid var(--rule)}
#layersec{flex:0 1 44%}
.sechead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px 6px;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.secbody{overflow:auto;padding:0 14px 14px;min-height:0}
.field{display:grid;grid-template-columns:82px minmax(0,1fr);gap:8px;align-items:center;margin:9px 0}
.field>label,.field>.lab{color:var(--muted);font-size:12px;font-weight:500}
.field.block{grid-template-columns:1fr}
.inp{width:100%;border:1px solid var(--rule);background:var(--panel2);border-radius:7px;padding:6px 8px;min-width:0}
.inp:focus{outline:2px solid var(--accent);background:var(--panel)}
textarea.inp{resize:vertical;min-height:34px}
.rngw{display:flex;align-items:center;gap:8px}
.rng{flex:1;min-width:0;accent-color:var(--accent)}
.val{width:38px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}
.seg{display:flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--panel2)}
.segb{flex:1;border:0;background:transparent;padding:5px 6px;font-size:12px;font-weight:600;min-width:0;white-space:nowrap}
.segb+.segb{border-left:1px solid var(--rule)}
.segb.on{background:var(--accent);color:var(--accent-ink)}
.swatches{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cust{position:relative;width:24px;height:24px;border-radius:50%;flex:none;cursor:pointer;background:conic-gradient(#e63946,#f4a300,#2a9d4b,#10b5b2,#2f6fe8,#b13fd6,#e63946);box-shadow:0 0 0 1px var(--rule)}
.cust::before{content:"+";position:absolute;inset:3px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font:700 14px/1 var(--ui);color:var(--ink)}
.cust.on::before{content:"";background:var(--c)}
.cust input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;padding:0;border:0}
.cust:focus-within{outline:2px solid var(--sel);outline-offset:1px}
.colorinp{width:26px;height:26px;padding:0;border:1px solid var(--rule);border-radius:50%;background:none;overflow:hidden;cursor:pointer}
.colorinp::-webkit-color-swatch-wrapper{padding:0}.colorinp::-webkit-color-swatch{border:0;border-radius:50%}
.none{width:22px;height:22px;border-radius:50%;border:1px dashed var(--muted);background:linear-gradient(135deg,transparent 46%,var(--danger) 47% 53%,transparent 54%);padding:0}
.dirgrid{display:grid;grid-template-columns:repeat(3,30px);gap:4px}
.dirgrid button{height:26px;border:1px solid var(--rule);border-radius:6px;background:var(--panel2);padding:0;display:grid;place-items:center}
.dirgrid button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dirgrid button:disabled{opacity:.35}
.btnrow{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.btnrow .btn{height:30px;padding:0 10px;font-size:12px}
.hr{height:1px;background:var(--rule);margin:14px 0}
.typehead{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;margin:6px 0 2px}
.help{font-size:12px;color:var(--muted);margin:6px 0}
.kbdlist{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12px;color:var(--muted)}
.kbdlist b{color:var(--ink);font-weight:600}

.lrows{margin-top:4px}
.lr{display:flex;align-items:center;gap:4px;margin:4px 0}
.lr.hid .inp{opacity:.5}
.lr .inp{flex:1}
.lr2{display:flex;align-items:center;gap:8px;margin:0 0 6px 30px}
.lr2 .inp{flex:1}
.kind{display:grid;place-items:center;width:24px;height:24px;flex:none;color:var(--ink)}
.lrow{display:flex;align-items:center;gap:2px;padding:2px 6px 2px 8px;border-radius:8px;cursor:pointer;min-height:32px}
.lrow:hover{background:var(--panel2)}
.lrow.active{background:var(--accent-soft)}
.lrow .lname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;padding:0 4px}
.lrow .cnt{font-size:11px;color:var(--muted);padding:0 4px;font-variant-numeric:tabular-nums}
.mini{width:26px;height:26px;border:0;background:transparent;border-radius:6px;display:grid;place-items:center;color:var(--muted);padding:0}
.mini:hover{background:var(--rule);color:var(--ink)}
.mini .ic{width:16px;height:16px}
.mini.off{opacity:.45}
.chev{transition:transform .12s}.chev.open{transform:rotate(90deg)}
.orow{display:flex;align-items:center;gap:8px;padding:3px 8px 3px 40px;border-radius:6px;cursor:pointer;min-height:26px;color:var(--ink)}
.orow:hover{background:var(--panel2)}
.orow.sel{background:var(--sel);color:#fff}
.orow .ic{width:14px;height:14px;opacity:.8}
.orow span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lstrip{border-top:1px solid var(--rule);padding:10px 14px;display:flex;flex-direction:column;gap:8px;background:var(--panel)}
#layerList{overflow:auto;padding:0 6px 6px;min-height:60px}
.dot{width:12px;height:12px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.2)}

#modalbg{position:fixed;inset:0;background:rgba(8,16,14,.5);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--panel);border:1px solid var(--rule);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.35);width:min(640px,100%);max-height:calc(100% - 8px);display:flex;flex-direction:column;overflow:hidden}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--rule);font:700 19px/1 var(--display);letter-spacing:.01em}
.mbody{padding:16px 18px 20px;overflow:auto}
.mbody h4{margin:18px 0 8px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.mbody h4:first-child{margin-top:0}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.card{border:1px solid var(--rule);border-radius:12px;padding:12px;background:var(--panel2)}
.drop{border:1.5px dashed var(--rule);border-radius:12px;padding:14px;text-align:center;color:var(--muted);background:var(--panel2)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.code{width:100%;height:84px;font:11px/1.35 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
.preview{display:grid;place-items:center;background:repeating-conic-gradient(var(--panel2) 0 25%,var(--panel) 0 50%) 0 0/16px 16px;border:1px solid var(--rule);border-radius:12px;padding:12px;min-height:160px}
.preview img{max-width:100%;max-height:280px;box-shadow:0 2px 14px rgba(0,0,0,.2);background:transparent}
#toast{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-weight:600;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

@media (max-width:860px){
  #app{grid-template:"top" 52px "tools" 52px "stage" minmax(0,1fr) / minmax(0,1fr)}
  #tools{flex-direction:row;border-right:0;border-bottom:1px solid var(--rule);padding:6px 12px;overflow-x:auto;overflow-y:hidden;justify-content:flex-start}
  .tsep{width:1px;height:24px;margin:0 6px}
  #side{position:fixed;right:0;top:calc(52px + env(safe-area-inset-top,0px));bottom:env(safe-area-inset-bottom,0px);width:min(340px,92vw);z-index:30;transform:translateX(102%);transition:transform .18s;box-shadow:var(--shadow)}
  body.panels #side{transform:none}
  .narrow-only{display:inline-flex}
  #saveState,.brand span{display:none}
  .nameinp{width:34vw}
  #hint{display:none}
  .btn .lbl{display:none}
  .two{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="app">

/* ---------- history ---------- */
function commit(){
  const s=JSON.stringify(doc);

  if(hist.stack.length>150) hist.stack.shift();
  hist.i=hist.stack.length-1;
  updateUndo(); scheduleSave(); refreshLayers();
}
function resetHistory(){ hist.stack=[JSON.stringify(doc)]; hist.i=0; updateUndo(); }
function restore(){
  doc=JSON.parse(hist.stack[hist.i]);

function undo(){ if(hist.i>0){hist.i--;restore();} }
function redo(){ if(hist.i<hist.stack.length-1){hist.i++;restore();} }

/* ---------- text measuring and layout ---------- */
const mctx=document.createElement('canvas').getContext('2d'); const mcache=new Map();
function measure(t,size,weight,italic,font){
  const key=t+'|'+size+'|'+weight+'|'+italic+'|'+font;
  let v=mcache.get(key); if(v!=null) return v;
  mctx.font=`${italic?'italic ':''}${weight} ${size}px ${font}`;
  v=mctx.measureText(t).width; if(mcache.size>4000) mcache.clear(); mcache.set(key,v); return v;
}
function layoutText(s){
  const rows=s.lines.map(t=>({t,size:s.size,weight:s.weight}));
  (s.sub||[]).forEach(t=>rows.push({t,size:s.subSize||s.size*.7,weight:400,sub:true}));
  const lhf=s.lh||1.2;
  const adv=rows.map((r,i)=>i===0?0:r.size*lhf+(r.sub&&!rows[i-1].sub?r.size*.05:0));
  const w=Math.max(0,...rows.map(r=>measure(r.t,r.size,r.weight,s.italic,s.font)));
  const cap=rows[0].size*.72, H=adv.reduce((a,b)=>a+b,0)+cap;
  const top=s.valign==='mid'?s.ay-H/2:s.valign==='bottom'?s.ay-H:s.ay;
  const y0=top+cap;
  let x0,x1; if(s.anchor==='start'){x0=s.ax;x1=s.ax+w}else if(s.anchor==='end'){x0=s.ax-w;x1=s.ax}else{x0=s.ax-w/2;x1=s.ax+w/2}
  const pad=s.size*.15, ys0=top-pad, ys1=top+H+rows[rows.length-1].size*.28;
  const r=(s.rot||0)*Math.PI/180, c=Math.cos(r), sn=Math.sin(r);
  const R=(x,y)=>{const dx=x-s.ax,dy=y-s.ay;return [s.ax+dx*c-dy*sn,s.ay+dx*sn+dy*c];};
  return {s,rows,adv,y0,w,H,poly:[R(x0-pad,ys0),R(x1+pad,ys0),R(x1+pad,ys1),R(x0-pad,ys1)]};
}
function textSVG(t,fill,halo,extra=''){

    t.rows.map((r,i)=>`<tspan x="${s.ax}" ${i?`dy="${+t.adv[i].toFixed(2)}"`:`y="${+t.y0.toFixed(2)}"`}${r.sub?` font-size="${+r.size.toFixed(2)}" font-weight="${r.weight}" fill-opacity=".75"`:''}>${esc(r.t)||' '}</tspan>`).join('')+'</text>';
}

/* ---------- view ---------- */
const stage=$('#stage');
function applyView(){

}
function zoomAt(cx,cy,f){

function toWorld(e){const r=stage.getBoundingClientRect();return [(e.clientX-r.left-view.x)/view.k,(e.clientY-r.top-view.y)/view.k];}

  const d=p.doc||p; if(!Array.isArray(d.layers)&&!Array.isArray(d.objects)) throw new Error('That file is not a map from this app.');
  const nd=normalizeDoc(d);
  Object.entries(p.assets||{}).forEach(([id,data])=>{if(typeof data==='string'&&data.startsWith('data:')) registerAsset(id,data);});
  if(merge){
    const map=new Map(); nd.layers.forEach(l=>{map.set(l.id,uid('l'));});
    nd.layers.forEach(l=>doc.layers.push({...l,id:map.get(l.id),name:l.name+' (imported)'}));
    nd.objects.forEach(o=>doc.objects.push({...o,id:uid(),layer:map.get(o.layer)}));
    commit(); drawNow(); refreshAll(); toast('Added '+nd.layers.length+' layers from the file.'); return;
  }
  doc=nd; sel=new Set(); pen=null; activeLayer=(doc.layers[1]||doc.layers[0]).id; expanded=new Set([activeLayer]);
  resetHistory(); syncTop(); refreshAll(); fitView(); scheduleSave();
}
async function importFile(file,merge){
  try{ const text=await file.text(); loadPayload(await parseCode(text),merge); closeModal(); toast('Opened '+doc.name); }
  catch(err){ toast(err.message||'Could not open that file.'); }
}
let closeModal=()=>{};
function fileDialog(){
  const content=h('div',{});
  const codeBox=h('textarea',{class:'inp code',readonly:true,placeholder:'Making code…','aria-label':'Map code'});
  const info=h('div',{class:'help'},'');
  let codeText='';
  makeCode().then(c=>{codeText=c;codeBox.value=c;info.textContent=(c.length>200000?'Large code ('+(c.length/1e6).toFixed(1)+' MB) because the map has images. A map file is easier to share. ':'')+c.length.toLocaleString()+' characters.';}).catch(e=>{codeBox.value='';info.textContent='Could not build a code: '+e.message;});
  const nImg=Object.keys(usedAssets()).length;
  content.append(
    h('h4',{},'Save this map'),
    h('div',{class:'two'},
      h('div',{class:'card'},h('div',{style:'font-weight:700;margin-bottom:4px'},'Map file'),h('div',{class:'help',style:'margin:0 0 10px'},'A .json file with layers, lines and '+(nImg?nImg+' embedded image'+(nImg>1?'s':''):'any images you add')+'. Opens again in Metro System Mapper.'),
        h('button',{class:'btn primary',onclick:()=>saveFile(slug()+'.json',new Blob([JSON.stringify(payload(),null,1)],{type:'application/json'})),html:ic('download')+'Download file'})),
      h('div',{class:'card'},h('div',{style:'font-weight:700;margin-bottom:4px'},'Map code'),h('div',{class:'help',style:'margin:0 0 10px'},'One block of text you can paste into a chat or note and load later.'),
        h('button',{class:'btn',onclick:async()=>{try{await navigator.clipboard.writeText(codeText);toast('Map code copied');}catch(_){codeBox.removeAttribute('readonly');codeBox.focus();codeBox.select();toast('Press Ctrl+C to copy the selected code');}},html:ic('copy')+'Copy code'}))),
    h('div',{style:'margin-top:10px'},codeBox,info),
    h('h4',{},'Open a map'),
    (()=>{
      const merge=h('input',{type:'checkbox',id:'mergeBox'});
      const drop=h('div',{class:'drop'},'Drop a map file here, or ',h('button',{class:'btn',style:'margin-left:6px',onclick:()=>{$('#mapInput').dataset.merge=merge.checked?'1':'';$('#mapInput').click();}},'Choose file'));
      drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('over');}); drop.addEventListener('dragleave',()=>drop.classList.remove('over'));
      drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('over');const f=e.dataTransfer.files[0];if(f) importFile(f,merge.checked);});
      const paste=h('textarea',{class:'inp code',placeholder:'…or paste a map code here','aria-label':'Paste map code'});
      return h('div',{},drop,h('div',{style:'margin-top:10px'},paste),
        h('div',{class:'btnrow'},h('label',{class:'chk'},merge,'Add to this map as new layers instead of replacing it'),h('div',{class:'grow'}),
          h('button',{class:'btn primary',onclick:async()=>{try{loadPayload(await parseCode(paste.value),merge.checked);closeModal();if(!merge.checked)toast('Opened '+doc.name);}catch(err){toast(err.message||'Could not read that code.');}}},'Load code')));
    })(),
    h('h4',{},'Start fresh'),
    (()=>{
      let armed=false; const nb=h('button',{class:'btn danger'},'New blank map');
      nb.onclick=()=>{ if(!armed){armed=true;nb.textContent='Click again to discard this map';setTimeout(()=>{armed=false;nb.textContent='New blank map';},3000);return;} loadPayload({doc:blankDoc()}); closeModal(); toast('New blank map'); };
      return h('div',{class:'btnrow'},nb,h('button',{class:'btn',onclick:()=>{loadPayload({doc:tutorialDoc()});closeModal();toast('Loaded the quick tour map');}},'Load quick tour map'),h('button',{class:'btn',onclick:()=>{loadPayload({doc:sampleDoc()});closeModal();toast('Loaded the showcase map');}},'Load showcase map'),h('span',{class:'help',style:'margin:0 4px'},'Undo (Ctrl+Z) brings your map back after loading another.'));
    })());
  closeModal=openModal('Save and open',content);
}
function exportDialog(){
  let fmt='png', scale=2, transparent=false;
  const f=doc.frame;
  const preview=h('div',{class:'preview'}), dim=h('div',{class:'help'});
  const content=h('div',{});
  let url=null;
  const update=()=>{
    if(url) URL.revokeObjectURL(url);
    try{ url=URL.createObjectURL(new Blob([buildExportSVG({scale:1,transparent})],{type:'image/svg+xml'})); preview.innerHTML=''; preview.append(h('img',{src:url,alt:'Map preview'})); }catch(_){}
    const s=Math.min(scale,8192/Math.max(f.w,f.h));
    dim.textContent=fmt==='png'?`${Math.round(f.w*s)} × ${Math.round(f.h*s)} px`:`${f.w} × ${f.h} units, scales to any size`;
  };
  const seg=(opts,get,set)=>{const w=h('div',{class:'seg',style:'max-width:260px'});opts.forEach(([v,l])=>{const b=h('button',{type:'button',class:'segb'+(get()===v?' on':''),onclick:()=>{set(v);[...w.children].forEach(c=>c.classList.remove('on'));b.classList.add('on');sync();update();}},l);w.append(b);});return w;};
  const scaleRow=field('Resolution',seg([[1,'1×'],[2,'2×'],[3,'3×'],[4,'4×']],()=>scale,v=>scale=v));
  const sync=()=>{scaleRow.style.display=fmt==='png'?'':'none';};
  const tr=h('input',{type:'checkbox',onchange:e=>{transparent=e.target.checked;update();}});
  content.append(preview,dim,
    field('Format',seg([['png','PNG image'],['svg','SVG vector']],()=>fmt,v=>fmt=v)),scaleRow,
    field('Background',h('label',{class:'chk'},tr,'Transparent')),
    h('div',{class:'help'},'The export covers the paper area. Change its size in the map settings (select nothing, then edit width and height).'),
    h('div',{class:'btnrow'},h('div',{class:'grow'}),h('button',{class:'btn primary',id:'doExport',onclick:async ev=>{
      const b=ev.currentTarget; b.disabled=true;
      try{
        if(fmt==='svg') await saveFile(slug()+'.svg',new Blob([buildExportSVG({scale:1,transparent})],{type:'image/svg+xml'}));
        else{ const blob=await renderPNG(scale,transparent); if(blob) await saveFile(slug()+'.png',blob); else toast('Could not make the PNG.'); }
      }catch(err){ toast(err.message||'Export failed.'); }
      b.disabled=false;
    },html:ic('download')+'Download'})));
  sync(); update();
  const close=openModal('Export image',content);
  closeModal=()=>{if(url)URL.revokeObjectURL(url);close();};
}
async function renderPNG(scale,transparent){
  const f=doc.frame, s=Math.min(scale,8192/Math.max(f.w,f.h));
  const svg=buildExportSVG({scale:s,transparent}), url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));
  try{
    const img=new Image(); await new Promise((res,rej)=>{img.onload=res;img.onerror=()=>rej(new Error('The browser could not draw the map.'));img.src=url;});
    const c=document.createElement('canvas'); c.width=Math.round(f.w*s); c.height=Math.round(f.h*s);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    return await new Promise(res=>c.toBlob(res,'image/png'));
  } finally { URL.revokeObjectURL(url); }
}

/* ---------- images ---------- */
function readAsDataURL(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(file);});}
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('Could not read that image.'));i.src=src;});}
async function addImageFile(file,at){
  try{
    if(!file.type.startsWith('image/')) return;
    const lid=targetLayer(); if(!lid) return;
    let data=await readAsDataURL(file), im=await loadImg(data);
    let w=im.naturalWidth||320, h2=im.naturalHeight||200;
    if(file.type!=='image/svg+xml'&&(Math.max(w,h2)>2400||file.size>4e6)){
      const k=Math.min(1,2400/Math.max(w,h2)), c=document.createElement('canvas'); c.width=Math.round(w*k); c.height=Math.round(h2*k);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height); data=c.toDataURL(file.type==='image/png'?'image/png':'image/jpeg',.9); w=c.width; h2=c.height;
    }
    const id=uid('a'); registerAsset(id,data);
    const k=Math.min(1,doc.frame.w*.4/w,doc.frame.h*.5/h2), dw=Math.round(w*k), dh=Math.round(h2*k), c0=at||viewCenter();
    const o={id:uid(),type:'image',layer:lid,x:Math.round(c0[0]-dw/2),y:Math.round(c0[1]-dh/2),w:dw,h:dh,rot:0,opacity:1,asset:id,lock:true,nat:[w,h2],name:(file.name||'Image').replace(/\.[a-z0-9]+$/i,'')};
    doc.objects.push(o); sel=new Set([o.id]); commit(); selectionChanged(); toast('Image added. Drag the handles to resize.');
  }catch(err){ toast(err.message||'Could not add that image.'); }
}
$('#imgInput').addEventListener('change',e=>{const fs=[...e.target.files];e.target.value='';fs.forEach((f,i)=>addImageFile(f,i?[viewCenter()[0]+i*30,viewCenter()[1]+i*30]:null));});
$('#mapInput').addEventListener('change',e=>{const f=e.target.files[0],m=e.target.dataset.merge==='1';e.target.value='';if(f) importFile(f,m);});

/* ---------- autosave (this device only) ---------- */
let saveT=0;
const idb={
  open(){return new Promise((res,rej)=>{try{const r=indexedDB.open('loopline',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}catch(e){rej(e);}});},
  async get(k){const db=await this.open();return new Promise((res,rej)=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});},
  async set(k,v){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);});}
};
function scheduleSave(){
  clearTimeout(saveT); $('#saveState').textContent='Saving…';
  saveT=setTimeout(async()=>{ try{ await idb.set('autosave',{doc:clone(doc),assets:usedAssets()}); $('#saveState').textContent='Saved on this device'; }catch(_){ $('#saveState').textContent='Not saved on this device'; } },700);
}

/* ---------- keyboard and chrome wiring ---------- */
const typing=t=>t&&(t.tagName==='INPUT'&&!['checkbox','range','color','button'].includes(t.type)||t.tagName==='TEXTAREA'||t.tagName==='SELECT'||t.isContentEditable);
window.addEventListener('keydown',e=>{
  if(!$('#modalbg').hidden){ if(e.key==='Escape') closeModal(); return; }
  if(typing(e.target)){ if(e.key==='Escape') e.target.blur(); return; }
  const mod=e.ctrlKey||e.metaKey, k=e.key.toLowerCase();
  if(e.key===' '){ if(!spaceDown){spaceDown=true;stage.classList.add('panning');stage.style.cursor='grab';} e.preventDefault(); return; }
  if(mod&&k==='z'){ e.preventDefault(); e.shiftKey?redo():undo(); return; }
  if(mod&&k==='y'){ e.preventDefault(); redo(); return; }
  if(mod&&k==='d'){ e.preventDefault(); duplicateSel(); return; }
  if(mod&&k==='a'){ e.preventDefault(); sel=new Set(doc.objects.filter(o=>{const L=layerOf(o.layer);return L&&L.visible&&!L.locked;}).map(o=>o.id)); selectionChanged(); return; }
  if(mod) return;
  if(pen){
    if(e.key==='Enter'||e.key==='Escape'){ e.preventDefault(); finishPen(); return; }
    if(e.key==='Backspace'){ e.preventDefault(); if(pen.pts.length>1){pen.pts.pop();drawNow();} return; }
    if(k==='x'&&pen.kind==='line'){ pen.flip=!pen.flip; drawNow(); return; }
  }
  if(e.key==='Escape'){ if(sel.size){sel=new Set();selectionChanged();} else setTool('select'); return; }
  if(e.key==='Delete'||e.key==='Backspace'){ e.preventDefault(); deleteSel(); return; }
  if(e.key.startsWith('Arrow')){ e.preventDefault(); const st=e.shiftKey?doc.settings.grid:1; nudge(e.key==='ArrowLeft'?-st:e.key==='ArrowRight'?st:0,e.key==='ArrowUp'?-st:e.key==='ArrowDown'?st:0); return; }
  if(e.key==='+'||e.key==='='){ const r=stage.getBoundingClientRect(); zoomAt(r.width/2,r.height/2,1.25); return; }
  if(e.key==='-'||e.key==='_'){ const r=stage.getBoundingClientRect(); zoomAt(r.width/2,r.height/2,.8); return; }
  if(e.key==='0'){ fitView(); return; }
  if(k==='g'){ doc.settings.showGrid=!doc.settings.showGrid; renderOptBar(); drawNow(); scheduleSave(); return; }
  const t=TOOLS.find(x=>x.key&&x.key.toLowerCase()===k); if(t) setTool(t.id);
});
window.addEventListener('keyup',e=>{ if(e.key===' '){spaceDown=false;stage.classList.remove('panning');stage.style.cursor='';} });
stage.addEventListener('dblclick',e=>{
  const hEl=e.target.closest&&e.target.closest('[data-h]'); if(hEl&&tool==='select'){const [k,a]=hEl.dataset.h.split(':');if(k==='v'){const o=byId([...sel][0]);if(o)removeVertex(o,+a);}}
});
document.addEventListener('copy',e=>{ if(typing(e.target)||!sel.size) return; clipboard=selObjs().map(clone); e.preventDefault(); toast('Copied '+clipboard.length+' item'+(clipboard.length>1?'s':'')); });
document.addEventListener('cut',e=>{ if(typing(e.target)||!sel.size) return; clipboard=selObjs().map(clone); e.preventDefault(); deleteSel(); });
document.addEventListener('paste',e=>{
  if(typing(e.target)) return;
  const imgs=[...(e.clipboardData?.files||[])].filter(f=>f.type.startsWith('image/'));
  if(imgs.length){ e.preventDefault(); imgs.forEach((f,i)=>addImageFile(f,i?[viewCenter()[0]+i*30,viewCenter()[1]+i*30]:null)); return; }
  if(clipboard&&clipboard.length){
    e.preventDefault(); const lid=targetLayer(); if(!lid) return;
    const ns=clipboard.map(o=>{const c=clone(o);c.id=uid();c.layer=layerOf(o.layer)&&!layerOf(o.layer).locked?o.layer:lid;if(c.pts)c.pts=c.pts.map(p=>[p[0]+24,p[1]+24]);else{c.x+=24;c.y+=24;}return c;});
    clipboard=ns.map(clone).map(o=>{if(o.pts)o.pts=o.pts.map(p=>[p[0],p[1]]);return o;});
    doc.objects.push(...ns); sel=new Set(ns.map(o=>o.id)); commit(); selectionChanged();
  }
});
$('#undoBtn').onclick=undo; $('#redoBtn').onclick=redo;
$('#fileBtn').onclick=fileDialog; $('#exportBtn').onclick=exportDialog;
$('#panelsBtn').onclick=()=>document.body.classList.toggle('panels');
$('#addLayer').onclick=addLayer;
$('#zIn').onclick=()=>{const r=stage.getBoundingClientRect();zoomAt(r.width/2,r.height/2,1.25);};
$('#zOut').onclick=()=>{const r=stage.getBoundingClientRect();zoomAt(r.width/2,r.height/2,.8);};
$('#zFit').onclick=()=>fitView(); $('#zoomLabel').onclick=()=>{const r=stage.getBoundingClientRect();zoomAt(r.width/2,r.height/2,1/view.k);};
$('#mapName').addEventListener('input',e=>{doc.name=e.target.value||'Untitled map';});
$('#mapName').addEventListener('change',()=>commit());
$('#mapName').addEventListener('keydown',e=>{if(e.key==='Enter') e.target.blur();});
let rsT=0; window.addEventListener('resize',()=>{clearTimeout(rsT);rsT=setTimeout(drawNow,100);});

/* ---------- boot ---------- */
async function boot(){
  buildTools();
  let loaded=null;
  try{ loaded=await Promise.race([idb.get('autosave'),new Promise(r=>setTimeout(()=>r(null),700))]); }catch(_){}
  try{
    if(loaded&&loaded.doc&&Array.isArray(loaded.doc.layers)){ Object.entries(loaded.assets||{}).forEach(([id,d])=>registerAsset(id,d)); doc=normalizeDoc(loaded.doc); }
    else doc=tutorialDoc();
  }catch(_){ doc=sampleDoc(); }
  activeLayer=(doc.layers[1]||doc.layers[0]).id; expanded=new Set([activeLayer]);
  resetHistory(); syncTop(); setTool('select'); refreshAll(); fitView();
  $('#saveState').textContent=loaded?'Restored from this device':'Quick tour map';
  window.__loopline={get doc(){return doc;},get geo(){return currentGeo;}};
}
boot();
})();
